<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anjana Hisab - Family App</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/nepali-date-converter@3.3.4/dist/nepali-date-converter.umd.js"></script>

<style>
:root{ 
    --primary:#db2777; 
    --secondary:#9333ea;
    --green:#10b981;
    --red:#ef4444;
    --blue:#3b82f6;
    --glass-bg: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.15);
    --text-main: #ffffff;
    --text-muted: #cbd5e1;
    --radius: 16px;
}
*{box-sizing:border-box;margin:0;padding:0; font-family: 'Mukta', sans-serif;} 

body{
    color:var(--text-main);
    padding:16px;
    background: linear-gradient(135deg, #0f172a 0%, #2e1065 50%, #4c1d95 100%);
    background-attachment: fixed;
    min-height: 100vh;
}

.glass-card {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    box-shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.3);
}

.wrap { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

/* Top Header */
.top-header { 
    display: flex; align-items: center; gap: 15px; padding: 15px; border-radius: var(--radius); 
    background: linear-gradient(135deg, rgba(219, 39, 119, 0.9), rgba(147, 51, 234, 0.9));
    box-shadow: 0 8px 20px rgba(219, 39, 119, 0.3);
}
.couple-photo { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; }
.header-info h1 { font-size: 22px; font-weight: 800; }
.header-info p { font-size: 13px; color: #fbcfe8; }

/* Time Box */
.time-box { display: flex; justify-content: space-between; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px; margin-bottom: 16px; text-align: center; }
.time-item .flag { font-size: 20px; }
.time-item .label { font-size: 11px; color: var(--text-muted); font-weight: bold; }
.time-item .val { font-size: 18px; font-weight: 800; color: #fff; margin-top: 2px; }

/* Cards */
.card { padding: 16px; }
.card-title { font-size: 16px; font-weight: 700; margin-bottom: 15px; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }

/* Summary Grid */
.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.summary-box { padding: 15px; border-radius: 12px; text-align: center; background: rgba(0,0,0,0.2); border-bottom: 4px solid; }
.summary-box .title { font-size: 12px; color: var(--text-muted); font-weight: 600; }
.summary-box .amount { font-size: 20px; font-weight: 800; margin-top: 4px; }

/* Form Grid */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid .full { grid-column: span 2; }
.input-group { display: flex; flex-direction: column; gap: 5px; }
.input-group label { font-size: 13px; color: var(--text-muted); font-weight: 600; }
.input-group input, .input-group select {
    padding: 12px; border-radius: 10px; border: 1px solid var(--glass-border);
    background: rgba(0,0,0,0.2); color: #fff; font-size: 15px; outline: none;
}
.input-group select option { background: #1e1b4b; color: #fff; }

/* Buttons */
.btn-submit { width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 16px; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; cursor: pointer; margin-top: 10px; }
.btn-cancel { width: 100%; padding: 10px; border-radius: 10px; border: none; font-size: 14px; font-weight: 700; background: rgba(255,255,255,0.1); color: white; cursor: pointer; margin-top: 10px; display: none; }

/* Filter Bar */
.filter-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
.filter-bar select, .filter-bar input { padding: 10px; border-radius: 10px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); color: #fff; font-size: 14px; outline: none; }
.filter-bar input { flex: 1; min-width: 150px; }

/* Table */
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 600px; }
th { text-align: left; padding: 10px; font-size: 13px; color: var(--text-muted); border-bottom: 1px solid var(--glass-border); }
td { padding: 12px 10px; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }

/* Category Breakdown Items */
.cat-item { margin-bottom: 12px; }
.cat-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
.cat-bar-bg { height: 8px; background: rgba(255,255,255,0.1); border-radius: 5px; overflow: hidden; }
.cat-bar-fill { height: 100%; border-radius: 5px; transition: width 0.3s; }

/* Toast */
#toast { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 100px); background: #16a34a; color: white; padding: 10px 20px; border-radius: 20px; font-weight: 600; transition: 0.3s; z-index: 9999; opacity: 0; }
#toast.show { transform: translate(-50%, 0); opacity: 1; }

/* Music Button */
#musicBtn { position: fixed; bottom: 20px; right: 20px; width: 55px; height: 55px; border-radius: 50%; background: linear-gradient(45deg, #db2777, #9333ea); color: white; font-size: 22px; border: 2px solid white; box-shadow: 0 4px 15px rgba(147,51,234,0.5); cursor: pointer; z-index: 9999; display: flex; justify-content: center; align-items: center; }
</style>
</head>
<body>

<audio id="bgMusic" loop></audio>
<div id="toast">✓ <span id="toastMsg"></span></div>

<div class="wrap">
    <!-- HEADER -->
    <header class="top-header">
        <img src="wife.jpg" alt="Photo" class="couple-photo">
        <div class="header-info">
            <h1>🌸 अन्जना हिसाब</h1>
            <p id="nepaliDate">मिति...</p>
        </div>
    </header>

    <!-- LIVE CLOCK -->
    <div class="glass-card time-box">
        <div class="time-item">
            <div class="flag">🇸🇦</div>
            <div class="label">साउदी समय</div>
            <div class="val" id="saudiTime">--:--:--</div>
        </div>
        <div class="time-item">
            <div class="flag">🇳🇵</div>
            <div class="label">नेपाल समय</div>
            <div class="val" id="nepalTime">--:--:--</div>
        </div>
    </div>

    <!-- SUMMARY TOTALS -->
    <div class="summary-grid">
        <div class="summary-box" style="border-color: var(--green);">
            <div class="title">कुल आम्दानी</div>
            <div class="amount" id="sumIncome" style="color: var(--green);">रु. ०</div>
        </div>
        <div class="summary-box" style="border-color: var(--red);">
            <div class="title">कुल खर्च</div>
            <div class="amount" id="sumExpense" style="color: var(--red);">रु. ०</div>
        </div>
        <div class="summary-box" style="border-color: var(--blue); grid-column: span 2;">
            <div class="title">कुल बचत (Savings)</div>
            <div class="amount" id="sumSavings" style="color: var(--blue);">रु. ०</div>
        </div>
    </div>

    <!-- FORM -->
    <div class="glass-card card">
        <h2 class="card-title">➕ नयाँ रेकर्ड थप्नुहोस्</h2>
        <form id="entryForm">
            <div class="form-grid">
                <div class="input-group full">
                    <label>प्रकार (Type)</label>
                    <select id="type" onchange="updateCategories()">
                        <option value="expense">🔴 खर्च (Expense)</option>
                        <option value="income">🟢 आम्दानी (Income)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>मिति</label>
                    <input type="date" id="date" required>
                </div>
                <div class="input-group">
                    <label>रकम (रु.)</label>
                    <input type="number" id="amount" required placeholder="0">
                </div>
                <div class="input-group full">
                    <label>के को लागि? (कोटी)</label>
                    <select id="category" required></select>
                </div>
                <div class="input-group full">
                    <label>भुक्तानी माध्यम</label>
                    <select id="payment">
                        <option value="cash">💵 नगद (Cash)</option>
                        <option value="bank">🏦 बैंक (Bank)</option>
                        <option value="online">📱 अनलाइन (Online)</option>
                    </select>
                </div>
                <div class="input-group full">
                    <label>विवरण (Note)</label>
                    <input type="text" id="note" placeholder="जस्तै: तलब आयो / तेल किनेको">
                </div>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">सेभ गर्नुहोस्</button>
            <button type="button" class="btn-cancel" id="cancelBtn" onclick="cancelEdit()">रद्द गर्नुहोस्</button>
        </form>
    </div>

    <!-- FILTERS -->
    <div class="glass-card card">
        <div class="filter-bar">
            <select id="filterYear" onchange="renderData()">
                <option value="all">सबै वर्ष</option>
            </select>
            <select id="filterMonth" onchange="renderData()">
                <option value="all">सबै महिना</option>
                <option value="0">जनवरी</option><option value="1">फेब्रुअरी</option><option value="2">मार्च</option>
                <option value="3">अप्रिल</option><option value="4">मे</option><option value="5">जुन</option>
                <option value="6">जुलाई</option><option value="7">अगस्ट</option><option value="8">सेप्टेम्बर</option>
                <option value="9">अक्टोबर</option><option value="10">नोभेम्बर</option><option value="11">डिसेम्बर</option>
            </select>
            <input type="text" id="searchBar" placeholder="🔍 खोज्नुहोस्..." oninput="renderData()">
        </div>

        <!-- CATEGORY BREAKDOWN (कुन कुरामा कति) -->
        <h2 class="card-title" style="margin-top:20px;">📊 कुन कुरामा कति खर्च/आम्दानी?</h2>
        <div id="categoryBreakdown" style="margin-bottom: 20px;">
            <!-- Loads dynamically -->
        </div>

        <!-- DATA TABLE -->
        <h2 class="card-title">🧾 सबै कारोबारको सूची</h2>
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>मिति</th>
                        <th>प्रकार</th>
                        <th>विवरण</th>
                        <th style="text-align:right;">रकम</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div id="emptyState" style="text-align:center; padding: 20px; color:var(--text-muted); display:none;">कुनै रेकर्ड भेटिएन।</div>
    </div>
</div>

<button id="musicBtn" onclick="toggleMusic()">🎵</button>

<script>
/* ================= CONFIG ================= */
const DB_URL = "https://anjana-khata-default-rtdb.firebaseio.com/khata";
const EXP_URL = DB_URL + "/expenses";
const INC_URL = DB_URL + "/incomes";

const EXP_CATS = [
    { id:'khana', name:'खाना', icon:'🍚', color:'#f59e0b' },
    { id:'school_fee', name:'स्कुल फी', icon:'🏫', color:'#f97316' },
    { id:'bijuli', name:'बिजुली', icon:'💡', color:'#eab308' },
    { id:'pani', name:'पानी', icon:'💧', color:'#3b82f6' },
    { id:'gas', name:'ग्यास', icon:'🔥', color:'#ef4444' },
    { id:'wifi', name:'वाइफाइ', icon:'📶', color:'#06b6d4' },
    { id:'shopping', name:'सपिङ', icon:'🛍️', color:'#a855f7' },
    { id:'medical', name:'मेडिकल', icon:'💊', color:'#dc2626' },
    { id:'other_exp', name:'अन्य', icon:'📦', color:'#64748b' }
];

const INC_CATS = [
    { id:'salary', name:'तलब', icon:'💼', color:'#10b981' },
    { id:'business', name:'व्यापार', icon:'🏪', color:'#0ea5e9' },
    { id:'gift', name:'उपहार', icon:'🎁', color:'#8b5cf6' },
    { id:'other_inc', name:'अन्य', icon:'💰', color:'#14b8a6' }
];

const MONTHS = ['जनवरी','फेब्रुअरी','मार्च','अप्रिल','मे','जुन','जुलाई','अगस्ट','सेप्टेम्बर','अक्टोबर','नोभेम्बर','डिसेम्बर'];
const catMap = Object.fromEntries([...EXP_CATS, ...INC_CATS].map(c => [c.id, c]));

let allData = [];
let editingId = null;
let editingType = null;
const $ = id => document.getElementById(id);

function fmt(n) { return 'रु. ' + (Number(n)||0).toLocaleString('en-IN'); }
function toISO(d) { return d.toISOString().split('T')[0]; }
function formatDate(iso) { const [y,m,d] = iso.split('-'); return `${+d} ${MONTHS[+m-1]} ${y}`; }

/* ================= MUSIC LOGIC ================= */
const songs = ['song.mp3', 'song2.mp3'];
let songIdx = 0;
const audio = $('bgMusic');
audio.src = songs[songIdx];
audio.addEventListener('ended', () => {
    songIdx = (songIdx + 1) % songs.length;
    audio.src = songs[songIdx];
    audio.play().catch(e=>{});
});

let isPlaying = false;
function playMusic() {
    if(!isPlaying) {
        audio.play().then(()=>{ isPlaying=true; $('musicBtn').textContent='⏸️'; }).catch(e=>{});
    }
}
function toggleMusic() {
    if(isPlaying) { audio.pause(); isPlaying=false; $('musicBtn').textContent='🎵'; }
    else { playMusic(); }
}
document.body.addEventListener('click', (e)=>{ if(!e.target.closest('#musicBtn')) playMusic(); });

/* ================= CLOCK ================= */
function startClock() {
    setInterval(() => {
        const d = new Date();
        $('saudiTime').textContent = d.toLocaleTimeString('en-US', { timeZone:'Asia/Riyadh', hour12:false });
        $('nepalTime').textContent = d.toLocaleTimeString('en-US', { timeZone:'Asia/Kathmandu', hour12:false });
    }, 1000);
    try {
        const nd = new NepaliDate(new Date());
        $('nepaliDate').textContent = nd.format('DD MMMM YYYY', 'np');
    } catch(e) {}
}

/* ================= FORM & LOAD ================= */
function updateCategories() {
    const type = $('type').value;
    const cats = type === 'income' ? INC_CATS : EXP_CATS;
    $('category').innerHTML = cats.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
}

async function loadData() {
    try {
        const [expRes, incRes] = await Promise.all([fetch(EXP_URL+'.json'), fetch(INC_URL+'.json')]);
        const exps = await expRes.json() || {};
        const incs = await incRes.json() || {};
        
        allData = [];
        for(let k in exps) allData.push({ id:k, type:'expense', ...exps[k] });
        for(let k in incs) allData.push({ id:k, type:'income', ...incs[k] });

        // Populate Years
        const currentY = new Date().getFullYear();
        let years = new Set(allData.map(d => +d.date.split('-')[0]));
        years.add(currentY);
        let sortedYears = [...years].sort((a,b)=>b-a);
        $('filterYear').innerHTML = `<option value="all">सबै वर्ष</option>` + sortedYears.map(y=>`<option value="${y}">${y}</option>`).join('');

        renderData();
    } catch(e) { console.error("Load error", e); }
}

$('entryForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const type = $('type').value;
    const url = type === 'income' ? INC_URL : EXP_URL;
    
    const newData = {
        date: $('date').value,
        category: $('category').value,
        amount: Number($('amount').value),
        payment: $('payment').value,
        note: $('note').value.trim(),
        ts: Date.now()
    };

    $('submitBtn').textContent = 'सेभ हुँदै...';
    $('submitBtn').disabled = true;

    try {
        if(editingId) {
            if(editingType !== type) {
                let oldUrl = editingType === 'income' ? INC_URL : EXP_URL;
                await fetch(`${oldUrl}/${editingId}.json`, { method: 'DELETE' });
                await fetch(`${url}.json`, { method:'POST', body:JSON.stringify(newData) });
            } else {
                await fetch(`${url}/${editingId}.json`, { method:'PUT', body:JSON.stringify(newData) });
            }
            editingId = null; editingType = null;
            $('submitBtn').textContent = 'सेभ गर्नुहोस्';
            $('cancelBtn').style.display = 'none';
        } else {
            await fetch(`${url}.json`, { method:'POST', body:JSON.stringify(newData) });
        }
        
        $('amount').value = '';
        $('note').value = '';
        $('date').value = toISO(new Date());
        await loadData();
    } catch(e) { alert('सेभ गर्न सकिएन'); }
    finally { $('submitBtn').textContent = 'सेभ गर्नुहोस्'; $('submitBtn').disabled = false; }
});

function cancelEdit() {
    editingId = null; editingType = null;
    $('amount').value = ''; $('note').value = '';
    $('submitBtn').textContent = 'सेभ गर्नुहोस्';
    $('cancelBtn').style.display = 'none';
}

/* ================= RENDER & CALCULATE ================= */
function renderData() {
    updateCategories();
    
    const y = $('filterYear').value;
    const m = $('filterMonth').value;
    const search = $('searchBar').value.toLowerCase();

    let filtered = allData;
    if(y !== 'all') filtered = filtered.filter(d => +d.date.split('-')[0] === +y);
    if(m !== 'all') filtered = filtered.filter(d => (+d.date.split('-')[1]-1) === +m);
    if(search) filtered = filtered.filter(d => (d.note||'').toLowerCase().includes(search) || (catMap[d.category]||{}).name.toLowerCase().includes(search));

    // Calculations
    let incTotal = 0, expTotal = 0;
    let incCat = {}, expCat = {};

    filtered.forEach(d => {
        if(d.type === 'income') {
            incTotal += d.amount;
            incCat[d.category] = (incCat[d.category]||0) + d.amount;
        } else {
            expTotal += d.amount;
            expCat[d.category] = (expCat[d.category]||0) + d.amount;
        }
    });

    $('sumIncome').textContent = fmt(incTotal);
    $('sumExpense').textContent = fmt(expTotal);
    $('sumSavings').textContent = fmt(incTotal - expTotal);

    // Category Breakdown
    let breakdownHTML = '<div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">';
    
    // Income list
    breakdownHTML += '<div><h4 style="color:var(--green); margin-bottom:10px; font-size:14px;">🟢 आम्दानी</h4>';
    if(Object.keys(incCat).length === 0) breakdownHTML += '<p style="font-size:12px; color:var(--muted);">छैन</p>';
    for(let c in incCat) {
        let cat = catMap[c] || catMap.other_inc;
        let pct = incTotal ? (incCat[c]/incTotal*100) : 0;
        breakdownHTML += `
        <div class="cat-item">
            <div class="cat-header"><span>${cat.icon} ${cat.name}</span> <span>${fmt(incCat[c])}</span></div>
            <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${pct}%; background:${cat.color};"></div></div>
        </div>`;
    }
    breakdownHTML += '</div>';

    // Expense list
    breakdownHTML += '<div><h4 style="color:var(--red); margin-bottom:10px; font-size:14px;">🔴 खर्च</h4>';
    if(Object.keys(expCat).length === 0) breakdownHTML += '<p style="font-size:12px; color:var(--muted);">छैन</p>';
    for(let c in expCat) {
        let cat = catMap[c] || catMap.other_exp;
        let pct = expTotal ? (expCat[c]/expTotal*100) : 0;
        breakdownHTML += `
        <div class="cat-item">
            <div class="cat-header"><span>${cat.icon} ${cat.name}</span> <span>${fmt(expCat[c])}</span></div>
            <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${pct}%; background:${cat.color};"></div></div>
        </div>`;
    }
    breakdownHTML += '</div></div>';
    $('categoryBreakdown').innerHTML = breakdownHTML;

    // Table
    filtered.sort((a,b) => b.date.localeCompare(a.date) || b.ts - a.ts);
    $('tableBody').innerHTML = filtered.map(d => {
        let c = catMap[d.category] || { icon:'📦', name:'अन्य', color:'#64748b' };
        let isInc = d.type === 'income';
        let payIcon = d.payment === 'cash' ? '💵' : (d.payment === 'bank' ? '🏦' : '📱');
        
        return `<tr>
            <td>${formatDate(d.date)}</td>
            <td><span class="badge" style="background:${isInc?'#10b98120':'#ef444420'}; color:${isInc?'#10b981':'#ef4444'}; border:1px solid ${isInc?'#10b981':'#ef4444'};">${isInc?'आम्दानी':'खर्च'}</span></td>
            <td>${payIcon} ${c.icon} ${c.name} <br><small style="color:#94a3b8">${d.note||''}</small></td>
            <td style="text-align:right; font-weight:700; color:${isInc?'#10b981':'#fff'};">${isInc?'+':'-'} ${fmt(d.amount)}</td>
            <td style="text-align:right;">
                <button style="background:none; border:none; cursor:pointer;" onclick="editItem('${d.id}', '${d.type}')">✏️</button>
                <button style="background:none; border:none; cursor:pointer;" onclick="deleteItem('${d.id}', '${d.type}')">🗑️</button>
            </td>
        </tr>`;
    }).join('');
    $('emptyState').style.display = filtered.length === 0 ? 'block' : 'none';
}

window.editItem = (id, type) => {
    let item = allData.find(d => d.id === id); if(!item) return;
    $('type').value = type;
    editingType = type;
    updateCategories();
    $('date').value = item.date;
    $('category').value = item.category;
    $('amount').value = item.amount;
    $('note').value = item.note || '';
    $('payment').value = item.payment || 'cash';
    editingId = id;
    $('submitBtn').textContent = 'अपडेट गर्नुहोस्';
    $('cancelBtn').style.display = 'block';
    window.scrollTo({top:0, behavior:'smooth'});
};

window.deleteItem = async (id, type) => {
    if(!confirm('मेटाउने हो?')) return;
    let url = type === 'income' ? INC_URL : EXP_URL;
    await fetch(`${url}/${id}.json`, { method: 'DELETE' });
    loadData();
};

/* INIT */
(function init() {
    $('date').value = toISO(new Date());
    updateCategories();
    startClock();
    loadData();
})();
</script>
</body>
</html>
